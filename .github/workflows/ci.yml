name: CI

# 팀이 직접 운영하는 검사입니다. (운영진 워크플로 3종과는 별개)
# feature/* → develop PR 에서도 돌아 리뷰 전에 깨진 코드를 먼저 잡습니다.

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 (lint · type · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 의존성 설치
        run: pip install -e ".[dev]"

      - name: ruff 검사
        run: ruff check .

      - name: ruff 포맷 확인
        run: ruff format --check .

      - name: mypy 타입 검사
        run: mypy

      - name: 테스트
        run: python -m unittest discover -s tests -v

  frontend:
    name: 프론트엔드 (lint · format · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: prettier 확인
        run: npm run format:check

      - name: eslint 검사
        run: npm run lint

      - name: 빌드 (타입 검사 포함)
        run: npm run build
