name: CI

# 팀이 직접 운영하는 검사입니다. (운영진 워크플로 3종과는 별개)
# feature/* → develop PR 에서도 돌아 리뷰 전에 깨진 코드를 먼저 잡습니다.

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 (lint · type · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 의존성 설치
        run: pip install -e ".[dev]"

      - name: ruff 검사
        run: ruff check .

      - name: ruff 포맷 확인
        run: ruff format --check .

      - name: mypy 타입 검사
        run: mypy

      - name: 테스트
        run: python -m coverage run -m unittest discover -s tests -v

      - name: 커버리지 요약
        run: python -m coverage report

  frontend:
    name: 프론트엔드 (lint · format · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: prettier 확인
        run: npm run format:check

      - name: eslint 검사
        run: npm run lint

      - name: 테스트
        run: npm test

      - name: 빌드 (타입 검사 포함)
        run: npm run build

  e2e:
    name: 브라우저 E2E (가짜 AI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 백엔드 의존성 설치
        working-directory: backend
        run: pip install -e .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: E2E
        working-directory: frontend
        run: npm run e2e

      - name: 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/test-results
          retention-days: 7
