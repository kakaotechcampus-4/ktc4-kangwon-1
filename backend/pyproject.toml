[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaeum-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.12,<3",
  "openai>=2.15,<3",
  "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "langgraph>=1.2.12,<1.3",
]

[project.optional-dependencies]
# 개발·검사용. 배포에는 들어가지 않습니다.
#   pip install -e ".[dev]"
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["schema.sql"]
"app.agents.decision" = ["prompt.md", "evaluation_prompt.md"]
"app.agents.evaluators" = ["prompt.md"]
"app.agents.specialists" = ["prompt.md"]
"app.agents.map_analysis" = ["prompt.md"]
"app.agents.commercial_area" = ["data/*.csv"]
"app.agents.floating_population" = ["data/*.csv"]
"app.agents.business_lifecycle" = ["data/trdar_area/*"]
"app.industries" = ["data/*.csv", "data/*.json"]
"app.mock_data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
