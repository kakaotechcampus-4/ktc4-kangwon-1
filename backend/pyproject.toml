[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaeum-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.12,<3",
  "openai>=2.15,<3",
  "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
# 개발·검사용. 배포에는 들어가지 않습니다.
#   pip install -e ".[dev]"
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "coverage>=7,<8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.infrastructure.persistence" = ["schema.sql"]
"app.infrastructure.market_data.commercial_area" = ["data/*.csv"]
"app.infrastructure.market_data.floating_population" = ["data/*.csv"]
"app.infrastructure.market_data.business_lifecycle" = ["data/trdar_area/*"]
"app.domain.industries" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C901", "PLR0915", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# 2026-10-26 실측 기존 위반. 함수 분해는 담당자 합의 후 별도로 진행합니다.
"app/infrastructure/clients/address.py" = ["C901"]
"app/ai/aliases.py" = ["C901"]
"app/domain/availability.py" = ["C901"]
"app/ai/evaluators.py" = ["C901", "PLR0915"]
"app/ai/examiner.py" = ["C901"]
"app/application/facts.py" = ["C901", "PLR0915"]
"app/ai/founder.py" = ["C901"]
"app/application/inputs.py" = ["C901", "PLR0915"]
"app/ai/landlord.py" = ["C901"]
"app/infrastructure/llm/recording.py" = ["C901"]
"app/application/report.py" = ["C901", "PLR0915"]
"app/ai/runtime.py" = ["C901"]
"app/domain/scoring.py" = ["C901", "PLR0915"]
"app/application/snapshot.py" = ["C901"]
"app/domain/space_rules.py" = ["C901"]
"app/ai/sql_tool.py" = ["C901", "PLR0915"]
"app/ai/tools.py" = ["C901"]
"app/infrastructure/market_data/business_lifecycle/preprocess.py" = ["C901", "PLR0915"]
"app/infrastructure/market_data/commercial_area/client.py" = ["C901"]
"app/infrastructure/market_data/map_analysis/client.py" = ["C901"]
"app/infrastructure/clients/education_zone.py" = ["C901"]
"app/infrastructure/llm/client.py" = ["C901"]
"app/infrastructure/market_data/local/adapter.py" = ["C901"]
"app/infrastructure/market_data/local/database.py" = ["C901"]
"app/infrastructure/market_data/local/refresh.py" = ["C901"]
"app/infrastructure/market_data/seoul.py" = ["C901"]
"backtest/full.py" = ["C901", "PLR0915"]
"examiner_eval/frozen_v1.py" = ["C901"]
"scripts/audit_c1_density.py" = ["C901"]
"scripts/build_density_baseline.py" = ["C901"]
"scripts/build_industry_catalog.py" = ["C901"]
"scripts/measure_backend_load.py" = ["C901", "PLR0915"]
"scripts/refresh_local_data.py" = ["C901", "PLR0915"]
"tests/test_local_adapter.py" = ["PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
data_file = "cache/.coverage"

[tool.coverage.report]
precision = 2
