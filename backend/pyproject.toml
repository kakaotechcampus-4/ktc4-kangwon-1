[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaeum-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2.12,<3",
  "openai>=2.15,<3",
  "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.agents.commercial_area" = ["prompt.md", "data/*.csv"]
